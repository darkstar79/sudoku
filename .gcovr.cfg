# gcovr configuration file for sudoku project
# Used by both CI (.github/workflows/ci.yml) and local (scripts/coverage.sh)

# Root directory for coverage analysis
root = .

# Restrict gcda file search to the instrumented build only.
# Without this, gcovr merges Debug + RelWithDebInfo gcda files
# when both exist locally, producing inconsistent results vs CI
# (which only has the RelWithDebInfo build).
search-path = build/RelWithDebInfo

# Include only source files
filter = src/.*

# Exclude patterns (regular expressions)
exclude = tests/.*
exclude = build/.*
exclude = \..*conan.*
exclude = /usr/.*
exclude = .*catch2.*
exclude = .*yaml.*
exclude = .*spdlog.*
exclude = .*fmt.*
# Exclude view layer (requires Qt6 rendering context, not unit-testable)
exclude = src/view/.*

# Output settings
print-summary = yes

# Workaround for gcov bug with suspicious hit counts (GCC bug #68080)
gcov-ignore-parse-errors = suspicious_hits.warn_once_per_file

# Do not count exception-cleanup edges in the branch denominator.
#
# Every potentially-throwing call gets implicit try/catch cleanup branches, and reaching them
# needs OOM or a throw from deep inside libstdc++ — so they are almost pure denominator. On
# main @ fb1c156 the exclusion removed 5,525 branches locally of which only 18 were covered
# (0.3%), i.e. it drops the denominator without meaningfully moving the numerator. What
# remains is much closer to "branches the tests could actually take".
#
# It is NOT what makes local and CI agree — see the floor comment below before repeating that
# claim. See docs/CODE_QUALITY.md, "Toolchain divergence". Story 8-17.
#
# Cost, accepted knowingly: a `catch` block added and never tested is no longer penalised by
# the BRANCH gate. Its body still counts for line coverage and for the diff-cover patch gate,
# so the loss is bounded.
exclude-throw-branches = yes

# Minimum coverage thresholds (fail if below these percentages)
fail-under-line = 80
fail-under-function = 70  # ViewModel layer (game_view_model, training_view_model) requires Qt6 context; realistic ceiling ~73%

# Branch floor, re-derived 2026-08-03 (story 8-17) on unmodified main @ fb1c156.
# Measured on BOTH toolchains, RelWithDebInfo + -DSUDOKU_ENABLE_UI_TESTS=ON, gcovr 8.6:
#
#   toolchain                        without exclusion        with exclude-throw-branches
#   local GCC 16.1.1 (Fedora)        53.7% of 29,626  FAIL    65.9% of 24,101  PASS
#   CI    GCC 13.3.0 (ubuntu-24.04)  58.1% of 25,215  PASS    73.8% of 19,709  PASS
#
# The old comment calibrated this floor against ~15,700 branches; neither toolchain has
# been near that for a long time (CI alone counts 25,215 without the exclusion), and the
# spread between the two straddled the floor — the SAME source passed in CI and failed
# locally.
#
# WHAT THE EXCLUSION DOES AND DOES NOT EXPLAIN. Subtract the columns above: both compilers
# emit almost exactly the same number of throw branches — 5,525 local, 5,506 CI, 0.3% apart.
# So exception edges are NOT the source of the local/CI divergence; the extra ~4,400 branches
# GCC 16 reports are ORDINARY branches, and their cause is not established. The exclusion is
# justified on its own terms (it stops counting what tests cannot reach), but it did not make
# the toolchains agree — the gap between them widened, 4.4 to 7.9 points, which is what a
# roughly uniform +12-point shift on two different bases looks like.
#
# HENCE THE FLOOR MOVED UP, 55 -> 60. Lifting both measurements ~12 points while leaving the
# floor at 55 would have cleared the gate the same way lowering it 12 points would: CI's
# headroom went from 3.1 points to 18.8, i.e. roughly 3,700 branches could rot before the
# gate tripped where ~600 used to. 60 is the LOWER of the two measurements (65.9%, local
# GCC 16) minus ~6 points — the same headroom style the old 55 had against its ~59.5, now on
# an honest basis. The floor has never been lowered to make a number go green.
#
# Branch percentages stay compiler-specific: compare only against the SAME toolchain on
# another commit. Before changing this value, A/B the candidate against its baseline commit
# on one toolchain — see docs/CODE_QUALITY.md, "Toolchain divergence".
fail-under-branch = 60
