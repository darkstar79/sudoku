# gcovr configuration file for sudoku project
# Used by both CI (.github/workflows/ci.yml) and local (scripts/coverage.sh)

# Root directory for coverage analysis
root = .

# Restrict gcda file search to the instrumented build only.
# Without this, gcovr merges Debug + RelWithDebInfo gcda files
# when both exist locally, producing inconsistent results vs CI
# (which only has the RelWithDebInfo build).
search-path = build/RelWithDebInfo

# Include only source files
filter = src/.*

# Exclude patterns (regular expressions)
exclude = tests/.*
exclude = build/.*
exclude = \..*conan.*
exclude = /usr/.*
exclude = .*catch2.*
exclude = .*yaml.*
exclude = .*spdlog.*
exclude = .*fmt.*
# Exclude view layer (requires Qt6 rendering context, not unit-testable)
exclude = src/view/.*

# Output settings
print-summary = yes

# Workaround for gcov bug with suspicious hit counts (GCC bug #68080)
gcov-ignore-parse-errors = suspicious_hits.warn_once_per_file

# Do not count exception-cleanup edges in the branch denominator.
#
# Every potentially-throwing call gets implicit try/catch cleanup branches that a unit test
# cannot trigger by construction (they need OOM or a throw from deep inside libstdc++), so
# they are pure denominator. How many the compiler emits is a *toolchain* property, not a
# property of this codebase: GCC 16.1.1 emits roughly twice as many as the compiler this
# floor was originally calibrated against, which made the same unchanged `main` measure
# 53.7% locally and pass in CI. Excluding them measures what the tests can actually reach
# and makes the number comparable across compilers. See docs/TROUBLESHOOTING.md,
# "Local GCC 16 vs CI GCC 13". Story 8-17.
exclude-throw-branches = yes

# Minimum coverage thresholds (fail if below these percentages)
fail-under-line = 80
fail-under-function = 70  # ViewModel layer (game_view_model, training_view_model) requires Qt6 context; realistic ceiling ~73%

# Branch floor, re-derived 2026-08-03 (story 8-17) on unmodified main @ fb1c156.
# Measured on BOTH toolchains, RelWithDebInfo + -DSUDOKU_ENABLE_UI_TESTS=ON:
#
#   toolchain                       without exclusion        with exclude-throw-branches
#   local  GCC 16.1.1 (Fedora)      53.7% of 29,626  FAIL    65.9% of 24,101  PASS
#   CI     GCC 13.3.0 (ubuntu-24.04) 58.1% of 25,215  PASS    CI_WITH_EXCLUSION
#
# The old comment here calibrated this floor against ~15,700 branches; neither toolchain
# has been near that for a long time, and the 4.4-point spread between them straddled the
# floor itself — the SAME source passed in CI and failed locally. The floor was left where
# it is rather than moved: exclude-throw-branches fixes the measurement (see above), which
# is what the two numbers actually disagreed about. Before changing this value, A/B the
# candidate commit against its baseline_commit on ONE toolchain — see docs/CODE_QUALITY.md,
# "Toolchain divergence".
fail-under-branch = 55
