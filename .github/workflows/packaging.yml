name: Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # VERSION is the raw ref name; tags (v1.0.0) are filename-safe but
  # branch names like feature/release-1.0-prep contain '/'. Steps that
  # embed VERSION into output paths sanitize it with bash parameter
  # expansion, but the leading-'v' strip is applied ONLY for real tag
  # refs (REF_TYPE == 'tag'); on a branch/dispatch the name is kept as-is
  # so a branch like 'version-bump' is not corrupted into 'ersion-bump':
  #   if [ "$REF_TYPE" = tag ]; then version_safe="${VERSION#v}"; else version_safe="$VERSION"; fi
  #   version_safe="${version_safe//\//-}"
  # so a tag v1.0.0 yields the artifact-name version 1.0.0 — one identical
  # string across Flatpak/AppImage/DMG and CPack's NSIS name
  # (Sudoku-${PROJECT_VERSION}-win64, CMakeLists.txt). GHA expressions have
  # no replace() function, so the substitution has to happen in shell.
  # Pre-release tags: only the leading 'v' is stripped, so v1.0.0-rc2 yields
  # 1.0.0-rc2 in the Flatpak/AppImage/DMG names. The NSIS name would default
  # to CPack's suffix-less PROJECT_VERSION, so on tag refs the installer job
  # overrides CPACK_PACKAGE_FILE_NAME via `cpack -D` with this same tag-derived
  # string — all artifact names carry one identical version string, rc or final.
  VERSION: ${{ github.ref_name || 'dev' }}

jobs:
  release-guard:
    name: Release Guard (version integrity)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify tag ↔ version ↔ metainfo consistency
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # On a tag push, run in tag mode: asserts tag == v<PROJECT_VERSION> plus a fresh
          # metainfo release date, or accepts v<PROJECT_VERSION>-rc<N> (pre-release; date
          # window skipped). On any other trigger (workflow_dispatch from a branch) run
          # consistency-only mode. A mismatch fails here, before any artifact is built.
          if [[ "$REF" == refs/tags/* ]]; then
            ./scripts/check_release_consistency.sh "$REF_NAME"
          else
            ./scripts/check_release_consistency.sh
          fi

  flatpak:
    name: Flatpak Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: release-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Flatpak and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Platform//6.10 org.kde.Sdk//6.10

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo \
            build-flatpak flatpak/io.github.darkstar79.Sudoku.yml

      - name: Create Flatpak bundle
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Strip a leading 'v' only for real tag refs, so a branch/dispatch name is never corrupted.
          if [ "$REF_TYPE" = "tag" ]; then version_safe="${VERSION#v}"; else version_safe="$VERSION"; fi
          version_safe="${version_safe//\//-}"
          flatpak build-bundle repo \
            "Sudoku-${version_safe}-x86_64.flatpak" \
            io.github.darkstar79.Sudoku

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: Sudoku-*.flatpak
          retention-days: 90

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: release-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libgl1-mesa-dev \
            ninja-build ccache \
            libfuse2

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-linux-release-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-linux-release-

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=Release -o with_tests=False

      - name: Build Release
        run: |
          source build/Release/generators/conanbuild.sh
          cmake --preset release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build --preset release

      - name: Install to AppDir
        run: |
          DESTDIR=${{ github.workspace }}/AppDir cmake --install build/Release

      - name: Download linuxdeploy
        run: |
          curl -sL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sL -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Create AppImage
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Strip a leading 'v' only for real tag refs, so a branch/dispatch name is never corrupted.
          if [ "$REF_TYPE" = "tag" ]; then version_safe="${VERSION#v}"; else version_safe="$VERSION"; fi
          version_safe="${version_safe//\//-}"
          export LDAI_OUTPUT="Sudoku-${version_safe}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: Sudoku-*.AppImage
          retention-days: 90

  installer:
    name: NSIS Installer
    runs-on: windows-2025
    timeout-minutes: 30
    needs: release-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      - name: Set QT6_DIR
        run: echo "QT6_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"
        shell: bash

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Install NSIS
        run: choco install nsis -y

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-windows-release-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-windows-release-

      - name: Install dependencies
        run: conan install . --build=missing --output-folder=build/Release -o with_tests=False

      - name: Configure CMake
        run: |
          call build\Release\generators\conanbuild.bat
          cmake -S . -B build/Release ^
            -G Ninja ^
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake ^
            -DCMAKE_BUILD_TYPE=Release ^
            "-DCMAKE_PREFIX_PATH=%QT6_DIR%"
        shell: cmd

      - name: Build
        run: cmake --build build/Release --config Release

      - name: Package installer
        env:
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          # On tag refs, name the installer from the tag (leading 'v' stripped) exactly like the
          # Flatpak/AppImage jobs, so a pre-release tag's -rcN suffix reaches the .exe name too —
          # CPack's PROJECT_VERSION carries no suffix. `cpack -D` overrides the CPACK_PACKAGE_FILE_NAME
          # baked into CPackConfig.cmake. Non-tag runs keep the CMake-derived name.
          if [ "$REF_TYPE" = "tag" ]; then
            version_safe="${VERSION#v}"
            cpack --config build/Release/CPackConfig.cmake -G NSIS -C Release -B build/Release \
              -D "CPACK_PACKAGE_FILE_NAME=Sudoku-${version_safe}-win64"
          else
            cpack --config build/Release/CPackConfig.cmake -G NSIS -C Release -B build/Release
          fi

      - name: Verify the installer ships the C++ runtime and installs per-user
        shell: bash
        run: |
          # Two silent-regression guards for the failure that made 1.0.0-rc1 unusable.
          #
          # 1. Bundled CRT. rc1 shipped no C++ runtime, so sudoku.exe bound to whatever MSVCP140.dll
          #    sat in System32 — 14.22 on the machine that reported it, below the >= 14.40 a VS 2022
          #    17.10+ binary needs — and faulted inside the CRT before the first log line, with no
          #    window and no message. CMakeLists.txt fails at configure time if the redist DLLs cannot
          #    be FOUND; this step proves they actually reached the package. Only the DLLs
          #    InstallRequiredSystemLibraries adds unconditionally are required, so a toolset that
          #    stops shipping an optional one (msvcp140_1, _2, _atomic_wait, _codecvt_ids,
          #    vcruntime140_1) cannot fail the build spuriously — they are listed, not asserted.
          #
          # 2. Per-user manifest. CPack's NSIS template hardcodes `RequestExecutionLevel admin`, and an
          #    elevated installer makes NSIS resolve $LOCALAPPDATA to %ProgramData% — that is how rc1
          #    installed itself to C:\ProgramData\Sudoku. Dropping CPACK_NSIS_DEFINES would silently
          #    reintroduce it, so assert the shipped manifest really requests asInvoker.
          set -euo pipefail

          staged=$(find build/Release/_CPack_Packages -maxdepth 3 -type d -name 'Sudoku-*-win64' | head -1)
          if [ -z "$staged" ]; then
            echo "::error::CPack staging directory not found — the bundled runtime could not be verified."
            exit 1
          fi
          echo "Staged install tree: $staged"
          # Informational: never the thing that decides the outcome, so the explicit checks below own
          # the error messages even when the tree has no DLLs at all.
          ls -l "$staged"/*.dll || true

          missing=0
          for dll in msvcp140.dll vcruntime140.dll concrt140.dll; do
            if [ ! -f "$staged/$dll" ]; then
              echo "::error::$dll is missing from the install tree — the installer would depend on the target machine's System32 copy."
              missing=1
            fi
          done

          # 3. The generated NSIS script. The installer's own header is compressed, so the compiled
          #    InstallDir cannot be read back out of the .exe — but project.nsi is plain text right
          #    here. Assert the vendored template (cmake/NSIS.template.in) was the one used and that
          #    its delta survived: a silent fall back to CPack's stock template would still produce a
          #    working installer, just one defaulting to $DOCUMENTS\Sudoku, which is how a 1.0.0-rc1
          #    test install ended up in D:\Dokumente\Sudoku.
          nsi=$(find build/Release/_CPack_Packages -maxdepth 3 -name 'project.nsi' | head -1)
          if [ -z "$nsi" ]; then
            echo "::error::Generated project.nsi not found — the install location could not be verified."
            exit 1
          fi
          grep -n 'InstallDir\|RequestExecutionLevel' "$nsi" || true
          if ! grep -q 'SUDOKU-VENDORED-NSIS-TEMPLATE' "$nsi"; then
            echo "::error::project.nsi was generated from CPack's stock template, not cmake/NSIS.template.in — check CMAKE_MODULE_PATH."
            missing=1
          fi
          # `\\` per backslash: grep's BRE unescapes it to the single backslash the .nsi contains.
          if ! grep -q 'InstallDir "\$LOCALAPPDATA\\Programs\\Sudoku"' "$nsi"; then
            echo "::error::project.nsi does not default to \$LOCALAPPDATA\\Programs\\Sudoku."
            missing=1
          fi
          if grep -q 'StrCpy \$INSTDIR "\$DOCUMENTS' "$nsi"; then
            echo "::error::project.nsi still falls back to \$DOCUMENTS — a per-user install would land in the user's Documents folder."
            missing=1
          fi

          installer=$(find build/Release -maxdepth 1 -name 'Sudoku-*-win64.exe' | head -1)
          if [ -z "$installer" ]; then
            echo "::error::No installer .exe found in build/Release."
            exit 1
          fi
          # The manifest lives uncompressed in the PE resources, so a plain binary grep reaches it.
          level=$(grep -a -o -m1 'requestedExecutionLevel level="[a-zA-Z]*"' "$installer" || true)
          echo "Installer manifest: ${level:-<none found>}"
          if [ "$level" != 'requestedExecutionLevel level="asInvoker"' ]; then
            echo "::error::Installer does not request asInvoker — it would elevate, and an elevated NSIS install resolves \$LOCALAPPDATA to %ProgramData%."
            missing=1
          fi

          [ "$missing" -eq 0 ]

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: build/Release/Sudoku-*-win64.exe
          retention-days: 90

  dmg:
    name: macOS DMG (Universal Binary)
    runs-on: macos-15
    timeout-minutes: 45
    needs: release-guard
    # macOS is out of scope for 1.0.0: there is no Apple Developer account, so
    # the DMG cannot be code-signed/notarized and would only ship as an unsigned
    # (Gatekeeper-hostile) image. Build it on demand only, and keep it OUT of the
    # `release` job's `needs` so it never gates a tagged release.
    # NOTE: the universal build below still needs work before it can be relied on
    # — conanfile.py's layout() hardcodes build/Release/generators, so the
    # per-arch `--output-folder=build/{arm64,x86_64}` does not place the Conan
    # toolchain where the configure step looks for it. Fix that first.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Qt6 and Ninja
        run: brew install qt ninja

      - name: Set QT6_DIR
        run: echo "QT6_DIR=$(brew --prefix qt)/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Install Conan
        run: pip install conan

      - name: Auto-detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages (arm64)
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-macos-arm64-release-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-macos-arm64-release-

      - name: Install Conan deps (arm64)
        run: |
          conan install . --build=missing \
            -s build_type=Release -s compiler.cppstd=23 \
            -s os.version=13.0 -s arch=armv8 \
            -o with_tests=False \
            --output-folder=build/arm64

      - name: Install Conan deps (x86_64)
        run: |
          conan install . --build=missing \
            -s build_type=Release -s compiler.cppstd=23 \
            -s os.version=13.0 -s arch=x86_64 \
            -o with_tests=False \
            --output-folder=build/x86_64

      - name: Build arm64
        run: |
          cmake -S . -B build/arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/arm64/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            "-DCMAKE_PREFIX_PATH=$QT6_DIR"
          cmake --build build/arm64

      - name: Build x86_64
        run: |
          cmake -S . -B build/x86_64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/x86_64/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            "-DCMAKE_PREFIX_PATH=$QT6_DIR"
          cmake --build build/x86_64

      - name: Create Universal Binary
        run: |
          cp -R build/arm64/bin/sudoku.app build/sudoku_universal.app
          lipo -create \
            build/arm64/bin/sudoku.app/Contents/MacOS/sudoku \
            build/x86_64/bin/sudoku.app/Contents/MacOS/sudoku \
            -output build/sudoku_universal.app/Contents/MacOS/sudoku
          lipo -info build/sudoku_universal.app/Contents/MacOS/sudoku

      - name: Deploy Qt frameworks (macdeployqt)
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/sudoku_universal.app

      - name: Create DMG
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Strip a leading 'v' only for real tag refs, so a branch/dispatch name is never corrupted.
          if [ "$REF_TYPE" = "tag" ]; then version_safe="${VERSION#v}"; else version_safe="$VERSION"; fi
          version_safe="${version_safe//\//-}"
          mkdir -p dist
          cp -R build/sudoku_universal.app dist/
          hdiutil create -volname "Sudoku" \
            -srcfolder dist \
            -ov -format UDBZ \
            "Sudoku-${version_safe}-macOS.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: Sudoku-*-macOS.dmg
          retention-days: 90

  release:
    name: Upload Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # macOS DMG intentionally excluded — it is gated to workflow_dispatch only
    # (see the dmg job) and is not part of a tagged release.
    needs: [flatpak, appimage, installer]
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Pre-release tags carry a hyphen (e.g. v1.0.0-rc1); final tags
          # (v1.0.0) do not. Mark RCs as pre-release and keep them off "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            Sudoku-*.flatpak
            Sudoku-*.AppImage
            Sudoku-*-win64.exe
